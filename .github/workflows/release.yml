name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: md2wp-linux-x86_64
          - os: macos-15-intel
            artifact: md2wp-macos-x86_64
          - os: macos-latest
            artifact: md2wp-macos-arm64
          - os: windows-latest
            artifact: md2wp-windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        shell: bash
        run: |
          pyinstaller --noconfirm --clean md2wp.spec
          mkdir -p dist/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/md2wp.exe "dist/release/${{ matrix.artifact }}.exe"
          else
            cp dist/md2wp "dist/release/${{ matrix.artifact }}"
            chmod +x "dist/release/${{ matrix.artifact }}"
          fi

      - name: Smoke test
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            "./dist/release/${{ matrix.artifact }}.exe" --help
          else
            "./dist/release/${{ matrix.artifact }}" --help
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
